
services:
  backend:
    image: secureplan-backend:local
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: runtime
    environment:
      NODE_ENV: development
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "postgresql://secureplan:secureplan_local@postgres:5432/secureplan"
      APP_ORIGIN: "https://localhost:8443"
      SECUREPLAN_SMTP_HOST: "mailpit"
      SECUREPLAN_LOGIN_HMAC_KEY: ${SECUREPLAN_LOGIN_HMAC_KEY:?set SECUREPLAN_LOGIN_HMAC_KEY (64 hex chars) in .env - see docs/docker.md}
      SECUREPLAN_PASSWORD_DENYLIST_PATH: "/run/secrets/password-denylist.txt"
    volumes:
      - type: bind
        source: ${SECUREPLAN_PASSWORD_DENYLIST_PATH:?set SECUREPLAN_PASSWORD_DENYLIST_PATH in .env - see docs/docker.md}
        target: /run/secrets/password-denylist.txt
        read_only: true
    # Readiness includes the database check; frontend waits for it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  frontend:
    image: secureplan-frontend:local
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: ../tls/localhost.pem
        target: /etc/nginx/tls/localhost.pem
        read_only: true
      - type: bind
        source: ../tls/localhost-key.pem
        target: /etc/nginx/tls/localhost-key.pem
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-skf", "-o", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: secureplan
      POSTGRES_PASSWORD: secureplan_local
      POSTGRES_DB: secureplan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - secureplan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureplan -d secureplan"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Pinned for reproducible rebuilds; the image ships its own healthcheck.
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  secureplan_pgdata:
