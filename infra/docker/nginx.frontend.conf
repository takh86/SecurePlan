server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/localhost.pem;
    ssl_certificate_key /etc/nginx/tls/localhost-key.pem;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Backend API through Docker network
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_url http://backend:3000;

        proxy_pass $backend_url;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router: support direct URLs
    location / {
        try_files $uri $uri/ /index.html;
    }
}