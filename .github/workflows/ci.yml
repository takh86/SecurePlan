name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # The frontend suite needs no database, secrets or build output. It runs in
  # parallel with the backend job instead of after it; `verify` requires both.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=frontend
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://secureplan:secureplan_local@127.0.0.1:5432/secureplan
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: secureplan
          POSTGRES_PASSWORD: secureplan_local
          POSTGRES_DB: secureplan
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --label secureplan.disposable-test=${{ github.run_id }}-${{ github.run_attempt }}
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U secureplan -d secureplan"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm run check:public
      - run: npm ci
      - run: cp .env.example .env
      - name: Verify disposable PostgreSQL identity before any fixture or migration write
        env:
          SECUREPLAN_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
          SECUREPLAN_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SECUREPLAN_TEST_TARGET_RECEIPT: ${{ runner.temp }}/secureplan-disposable-receipt.json
        run: |
          node scripts/disposable-test-target.mjs record
          echo "SECUREPLAN_TEST_TARGET_RECEIPT=$SECUREPLAN_TEST_TARGET_RECEIPT" >> "$GITHUB_ENV"
      - name: Provision ephemeral login-abuse HMAC key (CI-only)
        shell: bash
        run: |
          key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$key"
          echo "SECUREPLAN_LOGIN_HMAC_KEY=$key" >> "$GITHUB_ENV"
          unset key
      - name: Provision password denylist (not published or cached)
        shell: bash
        env:
          SECLISTS_REVISION: 997dd861b9fa2623f06f30d5f9085713ce830f0c
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          dir="$TMPDIR/secureplan-password-denylist"
          mkdir -p "$dir"
          base="https://raw.githubusercontent.com/danielmiessler/SecLists/${SECLISTS_REVISION}/Passwords/Common-Credentials"
          for name in 100k-most-used-passwords-NCSC.txt Pwdb_top-100000.txt; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 10 --retry 3 --max-time 60 \
              --output "$dir/$name" "$base/$name"
          done
          # The generator verifies the pinned source SHA-256 values; the backend loader
          # re-verifies the output digest and entry count at startup (fail closed).
          node scripts/build-password-denylist.mjs | grep -E '^(VERIFIED|ELIGIBLE_ENTRIES|UNIQUE_PASSWORDS|OUTPUT_SHA256|GENERATOR)'
          echo "SECUREPLAN_PASSWORD_DENYLIST_PATH=$dir/secureplan-local-denylist.txt" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run check:replacement-api
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:verify
      - run: npm run test:scripts
        env:
          NODE_ENV: development
      # The shared disposable database also hosts lock and catalog-drift tests.
      # Bound parallel files to avoid exhausting wait budgets on the CI runner.
      - run: npm run test:e2e -- --maxWorkers=2
      # This test commits temporary catalog drift. Run it after the shared
      # database suite so concurrent test files cannot observe that drift.
      - name: SP19 isolated planning-schema DDL wait
        run: npm run test:e2e -- admin-work-queue-real.e2e-spec.ts -t "rereads the exact planning signature after an observed DDL wait"
        env:
          SECUREPLAN_SP19_ISOLATED_DDL: '1'
      - name: Backend runtime readiness
        shell: bash
        run: |
          npm run start:backend > /tmp/secureplan-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/secureplan-backend.log
          exit 1
  # `verify` is the required status check of the main-ci-gate ruleset. It must
  # run even when a gate job fails (`always()`), because a skipped required
  # check counts as passed. It passes only if every gate job succeeded; a
  # failed, cancelled or skipped gate job fails it.
  verify:
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate job to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          echo "frontend=$FRONTEND_RESULT backend=$BACKEND_RESULT"
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
